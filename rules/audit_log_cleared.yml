id: audit_log_cleared
title: Security audit log cleared or audit policy changed
severity: critical
confidence: 0.9
description: >
  Someone cleared the Windows Security log (event 1102) or changed the audit
  policy (event 4719). Administrators very rarely need to do either, and
  hiding tracks is the most common reason anyone does.
match:
  category: process
  action: [log_cleared, audit_policy_change]
threshold: 1
tags: [defense-evasion, anti-forensics]
attack: [T1070]
